name: Linux Release build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

env:
  BUILD_CONFIG: ${{ inputs.configuration }}
  ENV_IMAGE: ghcr.io/${{ github.repository_owner }}/amethyst-centos-env:latest

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          path: tdesktop
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull build environment
        run: docker pull "$ENV_IMAGE"

      - name: Build (Docker)
        working-directory: tdesktop
        run: |
          CONFIG_ARG=""
          if [ "${{ inputs.configuration }}" = "Debug" ]; then
            CONFIG_ARG="-e CONFIG=Debug"
          fi
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            $CONFIG_ARG \
            "$ENV_IMAGE" \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Linux-${{ inputs.configuration }}
          path: tdesktop/out/Telegram
          if-no-files-found: error
